<head>
    <meta charset="UTF-8">

    <link rel="canonical" href="https://www.eirenetechsociety.in/DeveloperPortal.html">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Developer Portal Eirene Tech Society">
    <meta property="og:description" content="Developer Portal Eirene Tech Society API Documentation for Authorization Server and Order Fulfillment Processor Engine">
    <meta property="og:image" content="https://www.eirenetechsociety.in/ets_logo_mini.jpg">
    <meta property="og:url" content="https://www.eirenetechsociety.in/DeveloperPortal.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Developer Portal Eirene Tech Society">
    <meta name="twitter:description" content="Developer Portal Eirene Tech Society API Documentation for Authorization Server and Order Fulfillment Processor Engine">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 300vh;
            font-family: sans-serif;
        }
        .custom-header {
            height: 60px; 
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: absolute;
        }
        .custom-header img {
            height: 55px; 
        }
        .iframe-container {
            height: calc(100% - 70px); 
            width: 100%;
        }
        iframe {
            width: 100%;
            height: 113%;
            border: none; 
        }
        h1 {
           color: white;
           padding: 13px 23px;
           font-size: 20px;
        }
        .scroll-box-wrapper {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 10px;
          z-index: 1000;
        }
        .scroll-box {
          background-color: #1a1a1a;
          
          /* Base values at the very top of the page */
          width: 0%; 
          opacity: 0;
          
          /* Apply two separate animations tied to the scroll timeline */
          animation: 
            snapWidth steps(1, end) both,
            fadeInSmooth linear both;
          animation-timeline: scroll(root);
          
          /* Both animations execute across the header's height footprint */
          animation-range: 0px 30px; 
        }
        /* Sudden layout transformation */
        @keyframes snapWidth {
          from { width: 0%; }
          to { width: 100%; }
        }
        /* Smooth visual transition that occurs right at the threshold */
        @keyframes fadeInSmooth {
          0% {
            opacity: 0;
          }
          /* Keeps it hidden until the header is nearly gone, then fades in quickly */
          85% {
            opacity: 0;
          }
          100% {
            opacity: 1;
          }
        }
    </style>
</head>
<body>
    <header class="custom-header">
        <a href="https://www.eirenetechsociety.in"><img src="https://rahulkhare2088-ets.github.io/EireneTechSociety/ets_logo_latest2.png" alt="Eirene Tech Society Logo"></a>
        <div class="scroll-box-wrapper">
            <div class="scroll-box">
                 <H1>Developer Portal ETS</H1>
            </div>
        </div>
    </header>
    <div class="iframe-container">
        <iframe src="https://portal.eirenetechsociety.in/swagger-ui/index.html"></iframe>
    </div>
</body>
</html>
